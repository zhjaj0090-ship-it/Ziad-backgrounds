* {

}

body {

}

header {
    background: #0c2232;

}

.logo {
    font-size: 22px;

}

.logo span {

    font-size: 11px;
    margin-top: 5px;

}

.hero {
    text-align: center;

}

.hero p {

}

.search {

    max-width: 500px;
    margin: 20px auto 0;
    padding: 14px;
    border: 1px solid #31546a;
    border-radius: 12px;
    background: #102b3d;
    color: white;
    font-size: 16px;
    outline: none;
}

.search::placeholder {

}

.categories {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 9px;
    padding: 15px;
}

.category {
    background: #17374b;
    color: white;
    border: 1px solid #31546a;
    border-radius: 25px;
    padding: 10px 17px;
    cursor: pointer;
    font-size: 14px;
}

.category.active,
.category:hover {
    background: #c83b35;
    border-color: #c83b35;
}

h2 {
    margin: 15px;
    font-size: 22px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 12px;
}

.wallpaper {
    min-width: 0;
    background: #102b3d;
    padding: 8px;
    border-radius: 14px;
    border: 1px solid #234357;
    overflow: hidden;
}

.wallpaper img {
    display: block;
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 9px;
    background: #17374b;
}

.wallpaper button {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 12px 5px;
    border: none;
    border-radius: 9px;
    background: #c83b35;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.wallpaper button:hover {
    background: #e44c44;
}

.wallpaper button:active {
    transform: scale(0.98);
}

footer {
    text-align: center;
    color: #91b6c9;
    padding: 25px 10px;
    margin-top: 20px;
    border-top: 1px solid #254458;
    font-size: 13px;
}

.empty {
    display: none;
    text-align: center;
    padding: 30px 10px;
    color: #b5d1df;
}

@media (min-width: 700px) {
    .gallery {
        grid-template-columns: repeat(4, minmax(0, 1fr));

        gap: 16px;
    }

    .wallpaper img {

    }

    .hero h1 {
        font-size: 40px;
    }
}

<script>
function openWallpaper(filename) {
    const link = document.createElement("a");

    link.href = filename;
    link.download = filename;

    document.body.appendChild(link);
    link.click();
    link.remove();
}

function searchWallpapers() {
    const search = document.getElementById("search")
        .value.trim().toLowerCase();

    const cards = document.querySelectorAll(".wallpaper");
    let visible = 0;

    cards.forEach(card => {
        const number = card.dataset.number;
        const alt = card.querySelector("img").alt.toLowerCase();

        const match = number.includes(search) || alt.includes(search);

        card.style.display = match ? "" : "none";

        if (match) visible++;
    });

    document.getElementById("empty").style.display =
        visible ? "none" : "block";

    document.querySelectorAll(".category").forEach(button => {
        button.classList.remove("active");
    });
}

function filterWallpapers(category, button) {
    document.getElementById("search").value = "";

    document.querySelectorAll(".category").forEach(item => {
        item.classList.remove("active");
    });

    button.classList.add("active");

    const cards = document.querySelectorAll(".wallpaper");
    let visible = 0;

    cards.forEach(card => {
        const match =
            category === "all" ||
            card.dataset.category === category;

        card.style.display = match ? "" : "none";

        if (match) visible++;
    });

    document.getElementById("empty").style.display =
        visible ? "none" : "block";
}
</script>
