<meta charset="UTF-8">

<title>زياد للخلفيات | One Piece</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #071725;
    color: white;
}

header {
    background: #0c2232;
    padding: 18px 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #c83b35;
}

.logo {
    font-size: 22px;
    font-weight: bold;
}

.logo span {
    display: block;
    color: #9bb9c9;
    font-size: 11px;
    margin-top: 5px;
    direction: ltr;
}

.hero {
    text-align: center;
    padding: 35px 15px;
    background: linear-gradient(180deg, #123b53, #071725);
}

.hero h1 {
    font-size: 30px;
    margin: 0 0 12px;
    color: #ffffff;
}

.hero p {
    color: #b5d1df;
    line-height: 1.8;
}

.search {
    display: block;
    width: 100%;
    max-width: 500px;
    margin: 20px auto 0;
    padding: 14px;
    border: 1px solid #31546a;
    border-radius: 12px;
    background: #102b3d;
    color: white;
    font-size: 16px;
    outline: none;
}

.search::placeholder {
    color: #a9c9d8;
}

.categories {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 9px;
    padding: 15px;
}

.category {
    background: #17374b;
    color: white;
    border: 1px solid #31546a;
    border-radius: 25px;
    padding: 10px 17px;
    cursor: pointer;
    font-size: 14px;
}

.category.active,
.category:hover {
    background: #c83b35;
    border-color: #c83b35;
}

h2 {
    margin: 15px;
    font-size: 22px;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    padding: 12px;
}

.wallpaper {
    min-width: 0;
    background: #102b3d;
    padding: 8px;
    border-radius: 14px;
    border: 1px solid #234357;
    overflow: hidden;
}

.wallpaper img {
    display: block;
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 9px;
    background: #17374b;
}

.wallpaper button {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 12px 5px;
    border: none;
    border-radius: 9px;
    background: green;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.wallpaper button:hover {
    background: #e44c44;
}

.wallpaper button:active {
    transform: scale(0.98);
}

footer {
    text-align: center;
    color: #91b6c9;
    padding: 25px 10px;
    margin-top: 20px;
    border-top: 1px solid #254458;
    font-size: 13px;
}

.empty {
    display: none;
    text-align: center;
    padding: 30px 10px;
    color: #b5d1df;
}

@media (min-width: 700px) {
    .gallery {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        padding: 20px;
        gap: 16px;
    }

    .wallpaper img {
        height: 260px;
    }

    .hero h1 {
        font-size: 40px;
    }
}
    /* عرض الخلفية بحجم كبير */
.wallpaper img {
    cursor: zoom-in;
}

.image-viewer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.95);
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.image-viewer img {
    max-width: 100%;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 10px;
}

.close-viewer {
    position: absolute;
    top: 15px;
    left: 15px;
    padding: 10px 15px;
    background: #c83b35;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    }
</style>
</head>

    <br><br>
    صُنع لعشاق ون بيس 🏴‍☠️
</footer>
<script>
let showFavoritesOnly = false;

function getFavorites() {
    return JSON.parse(
        localStorage.getItem("onePieceFavorites") || "[]"
    );
}

function searchWallpapers() {
    const input = document.getElementById("search").value
        .trim()
        .toLowerCase();

    const wallpapers = document.querySelectorAll(".wallpaper");
    const empty = document.getElementById("empty");

    const luffyNames = [
        "لوفي", "لوفى", "luffy", "rufy",
        "ルフィ", "루피", "路飞", "魯夫"
    ];

    const isLuffy = luffyNames.some(name => input.includes(name));
    const favorites = getFavorites();
    let found = 0;

    wallpapers.forEach(function(wallpaper) {
        const number = String(wallpaper.dataset.number);
        let matches;

        if (input === "") {
            matches = true;
        } else if (isLuffy) {
            matches = Number(number) >= 1 && Number(number) <= 29;
        } else {
            matches = number.includes(input);
        }

        if (showFavoritesOnly) {
            matches = matches && favorites.includes(number);
        }

        wallpaper.style.display = matches ? "" : "none";
        if (matches) found++;
    });

    empty.style.display = found === 0 ? "block" : "none";
}

function updateHearts() {
    const favorites = getFavorites();

    document.querySelectorAll(".wallpaper").forEach(function(card) {
        const number = String(card.dataset.number);
        const heart = card.querySelector(".favorite-heart");

        if (heart) {
            heart.textContent = favorites.includes(number) ? "❤️" : "🤍";
        }
    });
}

document.querySelectorAll(".wallpaper").forEach(function(card) {
    card.style.position = "relative";

    const heart = document.createElement("button");
    heart.type = "button";
    heart.className = "favorite-heart";
    heart.style.cssText =
        "position:absolute;top:8px;right:8px;z-index:5;" +
        "padding:5px;cursor:pointer;";
"font-size:18px;background:transparent;border:0;border-radius:50%;" +
    heart.setAttribute("aria-label", "إضافة للمفضلة");

    heart.addEventListener("click", function(event) {
        event.stopPropagation();

        const number = String(card.dataset.number);
        let favorites = getFavorites();

        if (favorites.includes(number)) {
            favorites = favorites.filter(n => n !== number);
        } else {
            favorites.push(number);
        }

        localStorage.setItem(
            "onePieceFavorites",
            JSON.stringify(favorites)
        );

        updateHearts();
        searchWallpapers();
    });

    card.appendChild(heart);
});

const searchInput = document.getElementById("search");

if (searchInput) {
    const favoritesButton = document.createElement("button");
    favoritesButton.type = "button";
    favoritesButton.textContent = "❤️ عرض المفضلة";
    favoritesButton.style.cssText =
        "padding:10px 16px;margin:8px;border:0;border-radius:10px;" +
        "background:#198754;color:white;font-size:16px;cursor:pointer;";

    searchInput.insertAdjacentElement("beforebegin", favoritesButton);

    favoritesButton.addEventListener("click", function() {
        showFavoritesOnly = !showFavoritesOnly;

        favoritesButton.textContent = showFavoritesOnly
            ? "↩ عرض كل الصور"
            : "❤️ عرض المفضلة";

        searchWallpapers();
    });
}

document.querySelectorAll(".wallpaper img").forEach(function(img) {
    img.style.cursor = "zoom-in";

    img.addEventListener("click", function() {
        const viewer = document.getElementById("imageViewer");
        const viewerImage = document.getElementById("viewerImage");

        if (viewer && viewerImage) {
            viewerImage.src = this.src;
            viewer.style.display = "flex";
        }
    });
});

updateHearts();
</script>
